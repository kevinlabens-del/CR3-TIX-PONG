name: Deploy CR3@TIX PONG to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cr3atix-pong-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Apply VORTEX balance patch
        run: node scripts/vortex-build-patch.mjs

      - name: Ensure touch controller TypeScript compatibility
        run: node -e "const fs=require('fs');const p='app/game-state.ts';let s=fs.readFileSync(p,'utf8');s=s.replace('const globalWindow = window as Window & Record<string, unknown>;','const globalWindow = window as unknown as Window & Record<string, unknown>;');fs.writeFileSync(p,s);"

      - name: Run core tests
        run: npm run test:core

      - name: Build for GitHub Pages
        run: npm run build:github

      - name: Deploy gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./out
          publish_branch: gh-pages
          force_orphan: true
