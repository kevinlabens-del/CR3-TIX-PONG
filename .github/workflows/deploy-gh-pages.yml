name: Deploy CR3@TIX PONG to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cr3atix-pong-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync latest main
        shell: bash
        run: |
          git fetch origin main
          git reset --hard FETCH_HEAD
          echo "BUILDING_SHA=$(git rev-parse HEAD)"

      - name: Apply VORTEX-specific scoring windows
        shell: bash
        run: |
          sed -i 's/reaction: 32, ballSpeed: 745, winScore: 5, playerHeight: 174, enemyHeight: 205, modifier: "boss", reward: 95, aiBehavior: "boss", boss: "VORTEX"/reaction: 68, ballSpeed: 745, winScore: 5, playerHeight: 174, enemyHeight: 205, modifier: "boss", reward: 95, aiBehavior: "impulsive", boss: "VORTEX"/' app/v3-data.ts
          grep 'id: 8, chapter: 2' app/v3-data.ts

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Ensure touch controller TypeScript compatibility
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('app/game-state.ts')
          text = path.read_text()
          text = text.replace(
              'const globalWindow = window as Window & Record<string, unknown>;',
              'const globalWindow = window as unknown as Window & Record<string, unknown>;'
          )
          path.write_text(text)
          PY
          sed -n '279,284p' app/game-state.ts

      - name: Run core tests (non-blocking)
        continue-on-error: true
        run: npm run test:core

      - name: Build for GitHub Pages
        id: build
        shell: bash
        run: |
          set +e
          {
            echo "BUILDING_SHA=$(git rev-parse HEAD)"
            sed -n '279,284p' app/game-state.ts
            npm run build:github
          } > /tmp/cr3atix-build.log 2>&1
          code=$?
          cat /tmp/cr3atix-build.log
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Publish build diagnostics
        if: steps.build.outputs.exit_code != '0'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin gh-pages
          git checkout -B gh-pages origin/gh-pages
          cp /tmp/cr3atix-build.log BUILD_ERROR.txt
          git add BUILD_ERROR.txt
          git commit -m "Record failed Pages build diagnostics" || true
          git push origin gh-pages

      - name: Stop after failed build
        if: steps.build.outputs.exit_code != '0'
        run: exit 1

      - name: Deploy gh-pages
        if: steps.build.outputs.exit_code == '0'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./out
          publish_branch: gh-pages
          force_orphan: true
