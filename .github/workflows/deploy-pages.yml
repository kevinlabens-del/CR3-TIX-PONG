name: Déployer CR3@TIX PONG

on:
  push:
    branches: [main]
    paths:
      - "source/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le projet
        uses: actions/checkout@v6

      - name: Préparer Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: source/package-lock.json

      - name: Installer les dépendances
        working-directory: source
        run: npm ci

      - name: Compiler la PWA
        working-directory: source
        run: npm run build

      - name: Préparer GitHub Pages
        uses: actions/configure-pages@v5

      - name: Charger le site statique
        uses: actions/upload-pages-artifact@v4
        with:
          path: source/out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publier sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
